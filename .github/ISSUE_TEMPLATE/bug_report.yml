name: Bug report
description: Report an analysis, editor, rendering or export problem.
title: "[Bug] "
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Commands, editor steps, or a minimal synthetic project. Avoid private videos and credentials.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Commit/version, OS, Node.js/Python versions and browser.
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and coverage
      description: Logs, source/render crops, frame indices or a public reproduction. State what you could not verify.
