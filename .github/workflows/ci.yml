name: Validate public source
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: npm ci
      - run: python -m pip install -r requirements.txt
      - run: npx playwright install --with-deps chromium
      - run: npm test -- --maxWorkers=1
      - run: python -m pytest tests/backend
      - run: npm run test:workflow
        env:
          FRAMEFORM_PYTHON: python
      - run: npm run build
      - name: Check text editing, frame redraw and offline export
        env:
          FRAMEFORM_TEST_URL: http://127.0.0.1:5173
        run: |
          npm run dev:web > "$RUNNER_TEMP/saegim-vite.log" 2>&1 &
          web_pid=$!
          trap 'kill "$web_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS "$FRAMEFORM_TEST_URL" > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS "$FRAMEFORM_TEST_URL" > /dev/null
          npx playwright test tests/e2e/frame-redraw.spec.ts tests/e2e/text-refit.spec.ts tests/e2e/paint-antialias.spec.ts
      - run: npm run test:elements
      - run: npm run release:check
      - run: npm run release:package
      - uses: actions/upload-artifact@v4
        with:
          name: saegim-source
          path: dist/github-source/saegim-source.zip
          if-no-files-found: error
